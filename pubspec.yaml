name: a2a
description: An implementation of the Google A2A protocol and SDK for client and server development
version: 4.3.0
repository: https://github.com/shamblett/a2a
homepage: https://github.com/shamblett/a2a

funding:
  - https://www.darticulate.com/#funding

executables:
  a2a_cli_client:

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
    genkit: '^0.14.1'
    oxy: '^0.2.2'
    web: '^1.1.1'
    json_annotation: '^4.12.0'
    colorize: '^3.0.0'
    args: '^2.7.0'
    uuid: '^4.5.3'
    events_emitter: '^0.6.0'
    darto: '^1.2.0'
    meta: '^1.18.3'
    genai_primitives: '^0.2.3'


dev_dependencies:
  test: '^1.31.1'
  lints: '^6.1.0'
  shelf: '^1.4.2'
  shelf_router: '^1.1.4'
  shelf_static: '^1.1.3'
  http: '^1.6.0'
  json_serializable: '^6.14.0'
  build_runner: '^2.15.0'
  json_rpc_2: '^4.1.0'
  stream_channel: '^2.1.4'
  build_test: '^3.5.15'
  build_web_compilers: '^4.8.0'
  llm_dart: '^0.10.7'

topics:
  - ai
  - agents
  - web

screenshots:
    - description: 'Agent 2 Agent(A2A)'
      path: example/screenshots/a2a.jpg
